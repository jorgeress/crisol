[project]
name = "crisol"
version = "0.1.0"
description = "Motor de triaje estático de malware y banco de pruebas de reglas YARA"
requires-python = ">=3.11"
authors = [{ name = "Jorge García", email = "jorgegarcia.eso@gmail.com" }]
dependencies = [
    "yara-python>=4.5", "pefile>=2024.8.26", "oletools>=0.60",
    "capstone>=5.0", "rich>=13.0", "jinja2>=3.1",
]

[project.scripts]
crisol = "crisol.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
