name: ci
on: [push, pull_request]
jobs:
  test-and-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pytest
      - name: Compilar reglas YARA
        run: PYTHONPATH=src python -m yardstick.cli rules
      - name: Tests
        run: PYTHONPATH=src pytest -q
      - name: Benchmark de falsos positivos (goodware del runner)
        run: |
          mkdir -p corpus/goodware
          cp /usr/bin/ls /usr/bin/cat /usr/lib/x86_64-linux-gnu/libc.so.6 corpus/goodware/ 2>/dev/null || true
          python bench/harness.py --rules rules --goodware corpus/goodware \
            --malware corpus/malware --max-fp-rate 0.5
